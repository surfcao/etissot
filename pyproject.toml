[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "etissot"
version = "0.2.0"
description = "Tissot geometry for geographic embeddings"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Guofeng Cao"}]
license = {text = "MIT"}
keywords = ["location encoder", "geographic embedding", "Tissot indicatrix", "map projection", "GeoAI"]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: GIS"]
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
study = ["scipy>=1.15,<2", "torch>=2.6,<3", "matplotlib>=3.9,<4", "pyproj>=3.6,<4", "pillow>=10,<13"]
test = ["scipy>=1.15,<2", "torch>=2.6,<3", "matplotlib>=3.9,<4", "pyproj>=3.6,<4", "pillow>=10,<13", "einops==0.8.2"]
models = ["torch>=2.6,<3", "einops==0.8.2", "geoclip==1.2.1", "rshf==0.2.2", "safetensors==0.8.0"]

[project.scripts]
etissot = "etissot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
etissot = ["models/vendor/**/*.py", "models/vendor/**/LICENSE", "models/checkpoints.json", "models/resources/**/*"]
